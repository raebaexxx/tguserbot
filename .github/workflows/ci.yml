name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src plugins tests
      - name: Tests with coverage
        # No `--cov=<package>`: it replaces the `source` from pyproject and the
        # report silently stops covering plugins/, which is a quarter of the code
        # that runs in production. `--cov-fail-under` repeats the floor so the
        # build states what it insists on instead of trusting a setting two files
        # away; `tests/test_docs.py` asserts the two agree.
        run: >-
          pytest --cov --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n userbotctl deploy/install.sh deploy/alert.sh
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -S style userbotctl deploy/install.sh deploy/alert.sh

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit locked dependencies
        run: |
          python -m pip install --upgrade pip-audit
          # The deployment path installs from requirements.lock, so that is the
          # set that matters; the project itself is the local checkout.
          grep -v '^-e ' requirements.lock > /tmp/locked.txt || true
          pip-audit --requirement /tmp/locked.txt --strict
