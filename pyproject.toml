[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tguserbot"
version = "0.2.0"
description = "A modular Telegram userbot with a safe, reloadable plugin system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "raebaexxx" }]
dependencies = [
    "telethon==1.45.0",
    "yt-dlp==2026.8.19",
    "curl-cffi==0.16.3",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.9,<1",
    "types-yt-dlp",
]

[project.scripts]
tguserbot = "userbot.__main__:main"

[project.urls]
Homepage = "https://github.com/raebaexxx/tguserbot"
Source = "https://github.com/raebaexxx/tguserbot"
Issues = "https://github.com/raebaexxx/tguserbot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
userbot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=60 --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "git: tests that need the git executable",
]

[tool.coverage.run]
# `plugins/` is measured because a quarter of the code that runs in production
# was not being counted at all. A coverage number that silently excludes the
# plugins reads as a statement about the whole system and is not one.
source = ["src/userbot", "plugins"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true
